name: tun2connect CI

on:
  push:
    branches: [ main ]
    tags: [ 'tun2connect/v*' ]
    paths:
      - 'tun2connect/**'
      - 'scenarios/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/tun2connect.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tun2connect/**'
      - 'scenarios/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/tun2connect.yml'

defaults:
  run:
    working-directory: tun2connect

jobs:
  scenario-tests:
    name: Scenario unit and reporting tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scenarios/go.mod
          cache-dependency-path: scenarios/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Go tests (race)
        run: go test -race -count=1 ./scenarios/...

      - name: Reporting tests
        run: python3 -m unittest discover -s scenarios/common -p 'test_*.py'

      - name: Shell syntax
        run: find scenarios -name '*.sh' -print0 | xargs -0 -n 1 bash -n

  go-test:
    name: Build, vet & test (race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tun2connect/go.mod
          cache-dependency-path: tun2connect/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        working-directory: .
        run: |
          unformatted=$(gofmt -l tun2connect scenarios)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      # The Envoy interop test skips itself here (no ENVOY_CONNECT_* set);
      # the envoy-interop job below is where it runs for real.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Namespace redirect integration
        env:
          NETNS_PROXY_INTEGRATION: '1'
        run: |
          # Ubuntu 24.04 runners confine unprivileged user namespaces with
          # AppArmor; the test creates one with unshare -Urn.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          go test -race -count=1 -v ./pkg/netnsproxy -run '^TestNamespaceIntegration$'

  fuzz:
    name: Fuzz guest-facing parsers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tun2connect/go.mod
          cache-dependency-path: tun2connect/go.sum

      # Regression inputs under testdata/fuzz are replayed by the ordinary
      # test job; this runs each target for a bounded time looking for new ones.
      - name: Fuzz
        env:
          FUZZTIME: 45s
        run: ./test_fuzz.sh

  envoy-interop:
    name: Envoy boundary e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tun2connect/go.mod
          cache-dependency-path: tun2connect/go.sum

      # The full presubmit: the Go suite again, then an unmodified Envoy
      # terminating CONNECT (HTTP/1.1) and multiplexed CONNECT (h2) for the
      # library's own dialers, asserted from Envoy's own stats. Needs docker
      # and real egress (example.com), both of which the runner has.
      - name: Run Envoy interop presubmit
        run: ./test_envoy.sh
