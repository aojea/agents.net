name: kubernetes CI

on:
  push:
    branches: [ main ]
    paths:
      - 'kubernetes/**'
      - '.github/workflows/kubernetes.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'kubernetes/**'
      - '.github/workflows/kubernetes.yml'

env:
  GOWORK: off

defaults:
  run:
    working-directory: kubernetes

jobs:
  go-test:
    name: Build, vet & test (race + userns)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: kubernetes/go.mod
          cache-dependency-path: kubernetes/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        working-directory: .
        run: |
          unformatted=$(gofmt -l kubernetes)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: Enable unprivileged user namespaces for netns integration tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test (unit + Linux multi-netns & tc integration)
        run: go test -race -count=1 ./...

  kind-smoke:
    name: Kubernetes kind smoke test (connect-proxy PEP + cloud-provider-kind LoadBalancer ingress)
    needs: go-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: kubernetes/go.mod
          cache-dependency-path: kubernetes/go.sum

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.36.1

      - name: Install cloud-provider-kind
        run: go install sigs.k8s.io/cloud-provider-kind@latest

      - name: Run Kubernetes smoke test
        env:
          USE_CLOUD_PROVIDER_KIND: 'true'
        run: ./kubernetes/test/smoke.sh
