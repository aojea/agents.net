name: QEMU CI

on:
  push:
    branches: [ main ]
    paths:
      - 'scenarios/10-qemu-stream/**'
      - 'scenarios/cmd/target-server/**'
      - 'sdk/**'
      - '.github/workflows/qemu.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scenarios/10-qemu-stream/**'
      - 'scenarios/cmd/target-server/**'
      - 'sdk/**'
      - '.github/workflows/qemu.yml'

jobs:
  two-sandboxes:
    name: QEMU packet backend and lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod
          cache-dependency-path: |
            sdk/go.sum
            scenarios/go.sum
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 busybox-static bubblewrap cpio iproute2 jq curl file
      - name: Enable isolated namespaces and KVM
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agents.net
          key: firecracker-guest-kernel-6.18.41
      - name: Packet adapter tests
        run: go -C sdk test -race -count=1 ./pkg/qemuproxy ./cmd/qemuproxy
      - name: Run QEMU integration
        env:
          KEEP_RUN_DIR: '1'
        run: ./scenarios/10-qemu-stream/run.sh
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-integration
          path: |
            /tmp/agents-qemu.*/*.console
            /tmp/agents-qemu.*/*.audit
            /tmp/agents-qemu.*/*.log
            /tmp/agents-qemu.*/*.exit
            /tmp/agents-qemu.*/*.supervisor
          if-no-files-found: ignore