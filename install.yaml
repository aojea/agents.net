#
# All-in-one installation manifest for dra-agents-net (driver: dra.agents.net):
#   - ServiceAccount, ClusterRole, and ClusterRoleBinding (kube-system)
#   - GA Kubernetes DRA DeviceClass "dra.agents.net" (DRAConsumableCapacity)
#   - Node DaemonSet (DRA kubelet plugin + containerd NRI plugin)
#
# Install:
#   kubectl apply -f https://raw.githubusercontent.com/aojea/agents.net/main/install.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dra-agents-net
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dra-agents-net
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/status"]
    verbs: ["patch", "update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/driver"]
    resourceNames: ["dra.agents.net"]
    verbs: ["associated-node:patch", "associated-node:update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["clustertrustbundles"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dra-agents-net
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dra-agents-net
subjects:
  - kind: ServiceAccount
    name: dra-agents-net
    namespace: kube-system
---
# Kubernetes DRA DeviceClass for dra-agents-net (driver: dra.agents.net).
# Pairs with DRAConsumableCapacity (Beta, enabled by default since Kubernetes 1.36):
# each node publishes a single shared "agents-net" device whose requestPolicy defaults
# to consuming 1 sandbox unit per ResourceClaim.
# Cluster-admin datapath and PEP settings (confinementMode, nicBlockMode, adapterMode,
# policyEnforcementPoint with mandatory mTLS, limits, and attested attributes) belong
# in DeviceClass (FromClass). Workloads may only layer ingressPorts, proxy port/noProxy,
# and non-HostPath caTrust sources in ResourceClaimTemplate / ResourceClaim.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: dra.agents.net
spec:
  selectors:
    - cel:
        expression: device.driver == "dra.agents.net"
  config:
    - opaque:
        driver: dra.agents.net
        parameters:
          apiVersion: dra.agents.net/v1alpha1
          kind: DriverConfig
          confinementMode: PodNetworkIsolated
          nicBlockMode: DropAll
          adapterMode: HostTun
          maxConnections: 1024
          idleTimeoutSeconds: 300
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dra-agents-net
  namespace: kube-system
  labels:
    app.kubernetes.io/name: dra-agents-net
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dra-agents-net
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dra-agents-net
    spec:
      serviceAccountName: dra-agents-net
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 330
      tolerations:
        - operator: Exists
      containers:
        - name: dra-agents-net
          image: ghcr.io/aojea/agents.net/dra-agents-net:latest
          args:
            - --driver-name=dra.agents.net
            - --socket-root=/run/dra-agents-net/pods
            - --checkpoint-path=/run/dra-agents-net/state.db
            - --kubelet-root-dir=/var/lib/kubelet
            - --metrics-addr=:9102
            - --host-tun-socket=/run/hosttun/worker.sock
            # To enable the node ingress bridge (mandatory mTLS), mount server cert/key
            # and client CA and pass:
            # - --ingress-addr=:15080
            # - --ingress-tls-cert=/etc/dra-agents-net/ingress/tls.crt
            # - --ingress-tls-key=/etc/dra-agents-net/ingress/tls.key
            # - --ingress-client-ca=/etc/dra-agents-net/ingress/ca.crt
            # - --ingress-allowed-client-san=agents-net-ingress-gateway
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: metrics
              containerPort: 9102
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            failureThreshold: 20
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
          securityContext:
            privileged: true
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
              mountPropagation: HostToContainer
            - name: netns
              mountPath: /var/run/netns
              readOnly: true
              mountPropagation: HostToContainer
            - name: nri-sock
              mountPath: /var/run/nri
            - name: dra-agents-net-run
              mountPath: /run/dra-agents-net
            - name: hosttun-run
              mountPath: /run/hosttun
        - name: agents-net-stack
          image: ghcr.io/aojea/agents.net/agents-net-stack:latest
          args:
            - --socket=/run/hosttun/worker.sock
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: hosttun-run
              mountPath: /run/hosttun
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3607
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        - name: hosttun-run
          emptyDir:
            medium: Memory
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
            type: DirectoryOrCreate
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        - name: netns
          hostPath:
            path: /var/run/netns
            type: DirectoryOrCreate
        - name: nri-sock
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: dra-agents-net-run
          hostPath:
            path: /run/dra-agents-net
            type: DirectoryOrCreate
